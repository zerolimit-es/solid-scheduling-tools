name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly, so new advisories surface even when the code doesn't change
  schedule:
    - cron: '23 6 * * 1'   # Mondays, 06:23 UTC
  workflow_dispatch:

# CI only tests; it never writes to the repo.
permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node: ['22']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Fails if line, branch or function coverage drops below the minimums
      # in package.json ("test:coverage")
      - name: Run tests with coverage
        run: npm run test:coverage

  # Known vulnerabilities in the dependencies. The packages' peer dependencies
  # are installed by the apps that use them and audited there; this covers the
  # versions pinned here.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: npm audit
        run: npm audit --audit-level=high
